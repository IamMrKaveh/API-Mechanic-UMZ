name: CI

# Security-audit phase 5 pipeline:
#   * secret-scan          - gitleaks over the commits being pushed (blocking)
#   * secret-history-scan  - gitleaks over the whole history (weekly; tracks SEC-01 debt)
#   * build-test           - dotnet build -warnaserror + full test suite (Docker is available
#                            on the runner, so the Testcontainers database tests run too)
#   * dependency-audit     - dotnet list package --vulnerable --include-transitive (blocking)
#
# The previous ci.yml in this repository was a corrupt Excel workbook (accidentally
# committed binary); this file replaces it.

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Monday 03:00 UTC - full-history secret scan for the pending SEC-01 cleanup.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  GITLEAKS_VERSION: '8.30.1'
  # SHA256 of gitleaks_8.30.1_linux_x64.tar.gz (official checksums.txt).
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  secret-scan:
    name: Secret scan (new commits)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Determine commit range
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            head="HEAD"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "head=${head}" >> "$GITHUB_OUTPUT"

      - name: gitleaks (commit range)
        run: |
          set -euo pipefail
          gitleaks git --config .gitleaks.toml --redact --verbose --no-banner \
            --log-opts="${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}" .

  secret-history-scan:
    name: Secret scan (full history)
    # Not on every push: the historical SEC-01 leaks are removed by a coordinated
    # history rewrite (scripts/security/purge-git-history.ps1). This job keeps the
    # debt visible until then; see docs/07-operations/security-verification.md.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks (all history)
        run: |
          gitleaks git --config .gitleaks.toml --redact --verbose --no-banner --log-opts=--all .

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore API.sln

      - name: Build (warnings are errors)
        run: dotnet build API.sln -c Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test Tests/Tests.csproj -c Release --no-build
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore API.sln

      - name: Check for vulnerable packages
        run: |
          set -euo pipefail
          dotnet list API.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected. Upgrade them before merging."
            exit 1
          fi
          echo "No vulnerable NuGet packages reported."
