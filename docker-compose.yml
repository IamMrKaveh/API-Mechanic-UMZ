version: '3.8'

# Local development stack. PostgreSQL matches the application, its EF migrations
# and CI (the previous MSSQL stack was stale - security audit P3-001).
# All secrets come from the gitignored .env file (see .env.example).
# NEVER commit real values here. Images are pinned by digest (tag kept for
# readability); refresh digests from the registry manifest list after upgrades.
services:
  db:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: postgres_local
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-ledka}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ledka}"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Applies the canonical EF Core migration history on a healthy database.
  # Runs one shot; see docker/db-init.Dockerfile.
  db-init:
    build:
      context: .
      dockerfile: docker/db-init.Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-ledka};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Presentation/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      # Production by default (no dev error pages inside a container); developers
      # can still override to Development from the local .env file.
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      # Plaintext local connection to the compose database. Production must use a
      # CA-issued certificate with the standard connection string (see .env.example);
      # no TrustServerCertificate escape hatch is available for Postgres.
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-ledka};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}

volumes:
  postgres-data:
