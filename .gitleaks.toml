title = "Gitleaks configuration for Mechanic.Api"

# Project rules on top of the built-in gitleaks ruleset (useDefault).
# Every regex below must be RE2-compatible: no lookarounds, no backreferences.
# Enforced in pre-commit (`.githooks/pre-commit`, `.pre-commit-config.yaml`),
# in CI (`.github/workflows/ci.yml`) and by `scripts/security/verify-security.ps1`.
[extend]
useDefault = true

[[rules]]
id = "mechanic-jwt-signing-key"
description = "JWT signing key that matches the pattern of the key leaked through Git history (SEC-01)"
regex = '''Breaking[0-9]+Bad'''
tags = ["key", "jwt", "mechanic"]
  [[rules.allowlists]]
  description = "Documentation and tests quote the pattern, never a real key"
  paths = [
    '''SECURITY-AUDIT-REPORT\.md$''',
    '''\.gitleaks\.toml$''',
    '''(^|/)docs/''',
    '''(^|/)Tests/''',
    '''(^|/)skills/''',
    '''(^|/)\.workbuddy-ai/''',
  ]

[[rules]]
id = "mechanic-arvancloud-keys"
description = "ArvanCloud S3 access/secret key assigned as a 16+ character hex value"
regex = '''(?i)(?:access|secret)[-_]?key\s*[:=]\s*["']?[0-9a-f]{16,}["']?'''
tags = ["key", "storage", "arvancloud", "mechanic"]
  [[rules.allowlists]]
  description = "Placeholders and test fixtures"
  paths = [
    '''(^|/)Tests/''',
    '''(^|/)skills/''',
    '''\.env\.example$''',
    '''appsettings\.json$''',
  ]

[[rules]]
id = "mechanic-kavenegar-api-key"
description = "Kavenegar SMS API key (32+ hex characters next to the service name)"
regex = '''(?i)kavenegar[^\n]{0,80}["'][0-9A-Fa-f]{32,}["']'''
tags = ["key", "sms", "kavenegar", "mechanic"]

[[rules]]
id = "mechanic-zarinpal-merchant-id"
description = "Zarinpal merchant id (GUID) assigned in configuration or code"
regex = '''(?i)merchantid\s*[:=]\s*["'][0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}["']'''
tags = ["key", "payment", "zarinpal", "mechanic"]
  [[rules.allowlists]]
  description = "Zero and repeated-digit GUIDs are documented placeholders/test values"
  regexTarget = "match"
  regexes = [
    '''00000000-0000-0000-0000-000000000000''',
    '''11111111-1111-1111-1111-111111111111''',
  ]
  [[rules.allowlists]]
  paths = [
    '''(^|/)Tests/''',
    '''(^|/)skills/''',
  ]

[[rules]]
id = "mechanic-database-password-in-connection-string"
description = "Database connection string that embeds a password"
regex = '''(?i)(?:user\s*id|username)=[^;"]{1,64};\s*password=[^;"]{3,}'''
tags = ["connection-string", "database", "mechanic"]
  [[rules.allowlists]]
  description = "Documented placeholders and test values"
  regexTarget = "match"
  regexes = [
    '''Password=CHANGE_ME''',
    '''Password=1234;''',
    '''Password=xxx''',
    '''Password=your[_-]?password''',
    # docker-compose interpolates the password from .env at runtime
    '''Password=\$\{''',
  ]
  [[rules.allowlists]]
  paths = [
    '''(^|/)Tests/''',
    '''(^|/)skills/''',
    '''\.env\.example$''',
    '''(^|/)docs/''',
  ]

[[rules]]
id = "mechanic-postgres-uri-credentials"
description = "PostgreSQL connection URI that embeds user and password"
regex = '''postgres(?:ql)?://[^\s:/@]+:[^\s@]+@[^\s/]+'''
tags = ["connection-string", "database", "mechanic"]
  [[rules.allowlists]]
  description = "Documentation examples and test fixtures use dummy credentials"
  paths = [
    '''(^|/)docs/''',
    '''(^|/)Tests/''',
    '''(^|/)skills/''',
  ]

# Extend the built-in generic API key rule: the tests contain deliberately fake
# tokens, and they cannot be allowlisted as a value without weakening the rule.
[[rules]]
id = "generic-api-key"
  [[rules.allowlists]]
  description = "Test fixtures, documentation and vendored skill docs use dummy tokens"
  paths = [
    '''(^|/)Tests/''',
    '''(^|/)docs/''',
    '''(^|/)skills/''',
  ]

[[rules]]
id = "mechanic-production-settings-committed"
description = "Environment-specific settings file must never be committed (SEC-01/SEC-17)"
path = '''(?i)(^|/)appsettings\.(Production|Staging)\.json$'''
tags = ["file", "configuration", "mechanic"]

[[rules]]
id = "mechanic-agent-log-dump"
description = "Dumped agent/session log file (the otp.json leak vector, SEC-01)"
path = '''(?i)(^|/)otp\.json$'''
tags = ["file", "log", "mechanic"]

# Global allowlists. Only non-secret locations and documented placeholders belong
# here. Historical leaks are deliberately NOT allowlisted: they are reported as
# findings so the SEC-01 Git history rewrite removes them
# (see docs/07-operations/security-verification.md). The local, gitignored .env is
# excluded from working-tree scans by scanning only commit-candidate files
# (scripts/security/verify-security.ps1), not by an allowlist here - otherwise a
# committed .env would go undetected.
[[allowlists]]
description = "Build output, vendored docs, local runtime artifacts"
paths = [
  '''(^|/)\.git/''',
  '''(^|/)(bin|obj|node_modules)/''',
  '''\.min\.(js|css)$''',
  '''(^|/)skills/''',
  '''(^|/)\.vs/''',
  '''(^|/)\.workbuddy-ai/''',
  '''(^|/)\.dsh-temp/''',
  '''(^|/)Logs?/''',
  '''(^|/)keys/''',
  '''(^|/)TestResults/''',
]

[[allowlists]]
description = "Documented placeholders used by appsettings, docs and the .env template"
regexTarget = "match"
regexes = [
  '''(?:YOUR|CHANGE[_-]?ME)<[A-Z0-9_]+>''',
  '''"(?:Access|Secret)Key"\s*:\s*""''',
  '''ApiKey"\s*:\s*""''',
  '''OtpPepper"\s*:\s*""''',
  '''"Key"\s*:\s*""''',
]
